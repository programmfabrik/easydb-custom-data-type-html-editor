plugin:
  name: custom-data-type-html-editor
  version: 1.0
  url: https://github.com/programmfabrik/custom-data-type-html-editor
  displayname:
    en-US: "Custom Data Type: HTML Editor"
    de-DE: "Custom Data Type: HTML Editor"
  info:
    de-DE: |
      Ergänzt einen benutzerdefinierten Datentyp, mit dem Redakteure eigene HTML-Inhalte direkt in einem Feld erstellen und speichern können. Die Bearbeitung erfolgt in einem komfortablen WYSIWYG-Editor, sodass formatierter Text ohne manuelles Schreiben von Markup gepflegt werden kann.

      Auf Basis des Editors [TinyMCE](https://www.tiny.cloud/).
    en-US: |
      Adds a custom data type that lets editors create and store custom HTML content directly in a field. Content is edited in a rich WYSIWYG editor, so formatted text can be maintained without writing markup by hand.

      Powered by the [TinyMCE](https://www.tiny.cloud/) editor.
  server:
    api-version:
      require: 1
  webfrontend:
    url: custom-data-type-html-editor.js
    css: custom-data-type-html-editor.css
    lib: custom-data-type-html-editor-lib.js
    l10n: l10n/

custom_types:
  html_editor:
    mapping:
      search_value:
        type: text

base_config:
  - name: html_editor
    group: css
    parameters:
      custom_css_url:
        regex: "^https?://[^/]+?([a-z0-9]|/.*)$"
        type: text
        position: 1
